<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单退款审计 · 管理后台</title><link rel="stylesheet" href="css/style.css"><style>main{max-width:1100px;margin:28px auto;padding:0 18px}.card{background:white;padding:20px;border-radius:12px;margin:15px 0}label{display:inline-block;margin:7px 16px 7px 0}select,input,button{padding:7px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left;word-break:break-word}#notice{color:#536276}.muted{color:#64748b}</style></head>
<body><main><p><a href="dashboard.html">← 返回后台</a></p><h1>订单与退款只读审计</h1><p class="muted">按支付渠道区分 Mock 测试与非 Mock 候选记录。非 Mock 尚未独立验证为生产交易；此页不执行退款。</p>
<div class="card"><label>记录 <select id="kind"><option value="orders">订单</option><option value="refunds">退款</option></select></label><label>类别 <select id="dataClass"><option value="productionCandidate">非 Mock（待核验）</option><option value="test">Mock 测试</option></select></label><label>起始日期 <input id="since" type="date"></label><button id="search" type="button">查询</button></div>
<p id="notice" role="status"></p><div class="card"><table><thead id="head"></thead><tbody id="rows"></tbody></table><button id="more" type="button" hidden>加载更早记录</button></div></main>
<script src="js/config.js"></script><script src="js/common.js"></script><script src="js/commerce-audit.js"></script></body></html>
