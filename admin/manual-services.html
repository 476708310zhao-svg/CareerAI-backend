<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人工服务工单 · 管理后台</title><link rel="stylesheet" href="css/style.css"><style>body{background:#f5f7fb}.manual-wrap{max-width:1100px;margin:32px auto;padding:0 20px}.manual-card{background:white;border-radius:14px;padding:24px;margin:16px 0;box-shadow:0 3px 20px #1524410b}.manual-grid{display:grid;grid-template-columns:280px 1fr;gap:18px}.manual-list button{display:block;width:100%;padding:12px;margin:6px 0;text-align:left;background:#f4f7fc;border:0;border-radius:9px;cursor:pointer}.manual-card label{display:block;margin:14px 0}.manual-card input,.manual-card select,.manual-card textarea{max-width:100%;padding:8px;border:1px solid #cdd5e2;border-radius:6px}.manual-card textarea{width:100%;min-height:80px}.manual-muted{color:#657087}.manual-error{color:#b42318}button{cursor:pointer}@media(max-width:720px){.manual-grid{grid-template-columns:1fr}}</style></head>
<body><main class="manual-wrap"><p><a href="dashboard.html">← 返回后台</a></p><h1>人工服务工单</h1><p class="manual-muted">仅在用户授权有效期内处理；撤销或到期的资料不可再查看。此处不创建订单或收款。</p><p id="notice" role="status"></p>
<div class="manual-grid"><section class="manual-card manual-list"><h2>待处理工单</h2><label>状态 <select id="filter"><option value="">全部有效工单</option><option value="requested">待受理</option><option value="accepted">已受理</option><option value="in_progress">处理中</option><option value="delivered">已交付</option><option value="closed">已关闭</option></select></label><button id="refresh" type="button">刷新</button><div id="requests"></div></section>
<section class="manual-card"><h2>工单详情</h2><div id="detail" class="manual-muted">请选择一条有效工单。</div><div id="actions" hidden><label>下一状态 <select id="nextStatus"></select></label><label>处理说明 <textarea id="note" maxlength="500"></textarea></label><button id="changeStatus" type="button">保存状态</button><h3>登记交付</h3><p class="manual-muted">只登记文字摘要；已有简历文件 ID 可选，不上传或复制文件。</p><label>交付摘要 <textarea id="deliverySummary" maxlength="2000"></textarea></label><label>已有文件 ID（逗号分隔） <input id="fileRefs" inputmode="numeric" placeholder="可留空"></label><button id="deliver" type="button">确认交付</button></div><h3>审计与交付</h3><div id="history"></div></section></div></main>
<script src="js/config.js"></script><script src="js/common.js"></script><script src="js/manual-services.js"></script></body></html>
