name: Deploy Backend

on:
  workflow_dispatch:

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Upload immutable release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: ".,!node_modules,!.git,!.env,!uploads"
          target: /www/wwwroot/zhiyincareer-main/releases/${{ github.run_id }}-${{ github.sha }}

      - name: Verify, switch traffic and keep rollback target
        uses: appleboy/ssh-action@v1.0.3
        env:
          PRODUCTION_NGINX_CONFIG_PATH: ${{ vars.PRODUCTION_NGINX_CONFIG_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true
          envs: PRODUCTION_NGINX_CONFIG_PATH
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20
            RELEASE_DIR=/www/wwwroot/zhiyincareer-main/releases/${{ github.run_id }}-${{ github.sha }}
            cd "$RELEASE_DIR"
            EXPECTED_CURRENT=/www/wwwroot/zhiyincareer-main/releases/assessment-checkout-20261019-07c5583de9f79e205af7a8d2296ad4c1cd327d32-lf
            if [ "$(readlink -f /www/wwwroot/zhiyincareer-main/current)" != "$EXPECTED_CURRENT" ]; then
              echo "❌ 线上版本与已核验基线不符，停止发布" >&2
              exit 1
            fi
            chmod +x deploy.sh scripts/run-campus-sync.sh scripts/run-reminder-dispatch.sh scripts/backup-production.sh
            APP_DATA_DIR=/var/lib/jobapp-server BACKUP_DIR=/www/backups/zhiyincareer NGINX_CONFIG_PATH="$PRODUCTION_NGINX_CONFIG_PATH" bash scripts/backup-production.sh
            bash deploy.sh
            echo "✅ Backend deployed at $(date)"
