name: Deploy Backend

on:
  workflow_dispatch:

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployed baseline and JSearch credential
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 1m
          script_stop: true
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20
            EXPECTED_CURRENT=/www/wwwroot/zhiyincareer-main/releases/40289255405-a02a82d291d21e850f45fd27604e2483e6a547c6
            [ "$(readlink -f /www/wwwroot/zhiyincareer-main/current)" = "$EXPECTED_CURRENT" ] || { echo "Production baseline changed" >&2; exit 1; }
            cd "$EXPECTED_CURRENT"
            node - <<'NODE'
            require('dotenv').config({ path: '/var/lib/jobapp-server/.env' });
            const axios = require('axios');
            const key = process.env.RAPID_API_KEY;
            if (!key || key.length < 30) { console.error('Production JSearch key missing'); process.exit(1); }
            axios.get('https://jsearch.p.rapidapi.com/search-v2', {
              params: { query: 'software engineer jobs in United States', country: 'us', num_pages: 1 },
              headers: { 'X-RapidAPI-Key': key, 'X-RapidAPI-Host': 'jsearch.p.rapidapi.com' },
              timeout: 20000
            }).then(response => {
              const jobs = response.data?.data?.jobs;
              console.log(`Production JSearch HTTP ${response.status}; jobs=${Array.isArray(jobs) ? jobs.length : 'invalid'}`);
              if (response.status !== 200 || !Array.isArray(jobs)) process.exitCode = 1;
            }).catch(error => {
              console.error(`Production JSearch HTTP ${error.response?.status || 0}`);
              process.exitCode = 1;
            });
            NODE

      - name: Upload immutable release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: ".,!node_modules,!.git,!.env,!uploads"
          target: /www/wwwroot/zhiyincareer-main/releases/${{ github.run_id }}-${{ github.sha }}

      - name: Verify, switch traffic and keep rollback target
        uses: appleboy/ssh-action@v1.0.3
        env:
          PRODUCTION_NGINX_CONFIG_PATH: ${{ vars.PRODUCTION_NGINX_CONFIG_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true
          envs: PRODUCTION_NGINX_CONFIG_PATH
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20
            RELEASE_DIR=/www/wwwroot/zhiyincareer-main/releases/${{ github.run_id }}-${{ github.sha }}
            cd "$RELEASE_DIR"
            EXPECTED_CURRENT=/www/wwwroot/zhiyincareer-main/releases/40289255405-a02a82d291d21e850f45fd27604e2483e6a547c6
            if [ "$(readlink -f /www/wwwroot/zhiyincareer-main/current)" != "$EXPECTED_CURRENT" ]; then
              echo "❌ 线上版本与已核验基线不符，停止发布" >&2
              exit 1
            fi
            chmod +x deploy.sh scripts/run-campus-sync.sh scripts/run-reminder-dispatch.sh scripts/backup-production.sh
            APP_DATA_DIR=/var/lib/jobapp-server BACKUP_DIR=/www/backups/zhiyincareer NGINX_CONFIG_PATH="$PRODUCTION_NGINX_CONFIG_PATH" bash scripts/backup-production.sh
            bash deploy.sh
            echo "✅ Backend deployed at $(date)"
